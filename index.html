<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halteros · nos cambiamos</title>
<script>
var NUEVO='https://apphalteros.github.io/HalterosApp/';
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});
if(window.caches)caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})});
setTimeout(function(){location.replace(NUEVO+location.search+location.hash)},1500);
</script>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:20px;color:#111}a{display:inline-block;margin-top:14px;background:#e3262e;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700}</style>
</head><body><div><h2>🏋️ Halteros se cambió de dirección</h2><p>Te estamos llevando a la nueva app…<br>Si tenías la app instalada, bórrala e instala la nueva.</p>
<a id="go" href="https://apphalteros.github.io/HalterosApp/">Ir a la nueva app</a></div></body></html>
