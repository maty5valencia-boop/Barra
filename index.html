<style>

<script>
const LOGO=`<svg viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="14.5" width="62" height="3" rx="1.5" fill="#c0c6d0"/><rect x="21" y="13" width="22" height="6" rx="1" fill="#9aa3b2"/><rect x="18" y="11" width="3" height="10" rx="1" fill="#e8e8e8"/><rect x="43" y="11" width="3" height="10" rx="1" fill="#e8e8e8"/><rect x="11" y="3" width="6" height="26" rx="1.5" fill="#d7263d"/><rect x="5.5" y="5" width="5" height="22" rx="1.5" fill="#1f6feb"/><rect x="47" y="3" width="6" height="26" rx="1.5" fill="#d7263d"/><rect x="53.5" y="5" width="5" height="22" rx="1.5" fill="#1f6feb"/></svg>`;
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function ymd(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
const dt=s=>new Date(s+'T12:00:00');
const fmtD=(s,o)=>s?dt(s).toLocaleDateString('es-CL',o||{day:'numeric',month:'short'}):'';
const daysUntil=s=>Math.round((dt(s)-dt(ymd()))/864e5);
function mondayOf(s){const d=dt(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function addDays(s,n){const d=dt(s);d.setDate(d.getDate()+n);return ymd(d)}
const fk=n=>n==null||isNaN(n)?'—':(Math.round(n*10)/10).toString().replace('.',',');
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
let toastT;function toast(m){clearTimeout(toastT);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=m;el.style.display='block';toastT=setTimeout(()=>el.style.display='none',2800)}

/* ===================== dominio halterofilia ===================== */
const EX=[{k:'arranque',n:'Arranque'},{k:'envion',n:'Envión'},{k:'cargada',n:'Cargada'},{k:'jerk',n:'Jerk'},{k:'sfrontal',n:'Sentadilla frontal'},{k:'strasera',n:'Sentadilla trasera'},{k:'tarranque',n:'Tirón de arranque'},{k:'tenvion',n:'Tirón de envión'},{k:'pushpress',n:'Push press'}];
const EXC={arranque:'#8b5cf6',envion:'#ff5a1f',cargada:'#f59e0b',jerk:'#ec4899',sfrontal:'#06b6d4',strasera:'#3b82f6',tarranque:'#a78bfa',tenvion:'#fb923c',pushpress:'#22c55e'};
const AVC=['#8b5cf6','#ff5a1f','#06b6d4','#ec4899','#2ecc71','#f59e0b','#3b82f6'];const avc=n=>{let s=0;for(const c of String(n||''))s+=c.charCodeAt(0);return AVC[s%AVC.length]};
const EXN=Object.fromEntries(EX.map(e=>[e.k,e.n]));
function detectEx(t){t=norm(t);if(!t.trim())return null;
 if(/tiron.*(arr|snatch)|snatch ?pull/.test(t))return'tarranque';
 if(/tiron|clean ?pull|\bpull\b/.test(t))return'tenvion';
 if(/frontal|front/.test(t))return'sfrontal';
 if(/envion|clean ?(&|and|y) ?jerk|c ?& ?j|\bcyj\b|dos tiempos/.test(t))return'envion';
 if(/arranque|snatch|\barr\b/.test(t))return'arranque';
 if(/cargada|clean/.test(t))return'cargada';
 if(/jerk|split|tijera/.test(t))return'jerk';
 if(/press/.test(t))return'pushpress';
 if(/sentadilla|squat|\bsent\b/.test(t))return'strasera';
 return null}
const CATS={M:{sen:[60,65,71,79,88,94,110],you:[56,60,65,71,79,88,94]},F:{sen:[48,53,58,63,69,77,86],you:[44,48,53,58,63,69,77]}};
const age=by=>by?new Date().getFullYear()-by:null;
function ageGroup(by){const a=age(by);if(a==null)return'Edad sin dato';if(a<=14)return'Sub-15';if(a<=17)return'Juvenil';if(a<=20)return'Junior';if(a>=35)return'Máster';return'Senior'}
function catInfo(a){if(!a||!a.sex||!a.bw)return null;const ag=age(a.by);const L=CATS[a.sex][ag!=null&&ag<=17?'you':'sen'];for(const c of L)if(a.bw<=c)return{label:c+' kg',limit:c};return{label:'+'+L[L.length-1]+' kg',limit:null}}
function sinclair(total,bw,sex){if(!total||!bw||!sex)return null;const A=sex==='F'?0.787004341:0.722762521,b=sex==='F'?153.757:193.609;if(bw>=b)return total;return total*Math.pow(10,A*Math.pow(Math.log10(bw/b),2))}
const rnd=(x,step)=>{step=step||1;return Math.round(x/step)*step};
const kgOf=(a,ex,pct)=>{const rm=a?.rms?.[ex];return rm?rnd(rm*pct/100,a.step||1):null};
function parseScheme(s){const out=[];String(s||'').split(/[,;+]/).forEach(tok=>{const t=tok.trim().replace(/×/g,'x');if(!t)return;

function alertsFor(a){const out=[];const t=ymd();const ws=(a.wellness||[]).slice().sort((x,y)=>y.d.localeCompare(x.d));const w=ws.find(x=>x.d===t);
 if(w){if((w.dolor||0)>=5)out.push(['bad',`Dolor ${w.dolor}/10${w.zona?' ('+w.zona+')':''}`]);const r=readiness(w);if(r!=null&&r<50)out.push(['warn','Baja disposición hoy'])}
 if(ws.length>=2&&ws[0].sueno<=2&&ws[1].sueno<=2&&daysUntil(ws[1].d)>=-3)out.push(['warn','Duerme mal hace días']);
 const ll=(a.lastLogs||[]).slice().sort((x,y)=>y.d.localeCompare(x.d));
 if(ll.length&&daysUntil(ll[0].d)<-7)out.push(['','Sin entrenos en 7 días']);
 const r3=ll.slice(0,3).filter(l=>l.rpe);if(r3.length===3&&r3.reduce((s,l)=>s+l.rpe,0)/3>=9)out.push(['warn','RPE muy alto']);
 const c=nextComp();const ci=catInfo(a);if(c&&ci&&ci.limit&&a.bw>ci.limit&&daysUntil(c.date)<=21)out.push(['bad',`+${fk(a.bw-ci.limit)} kg sobre su categoría`]);
 return out}
function weekCount(a){const m=mondayOf(ymd());return(a.lastLogs||[]).filter(l=>l.d>=m).length}
function vTeam(){const list=athleteList();const t=ymd();
 let h=`<div class="row sp"><h1>Equipo</h1><button class="btn sm" onclick="A.addAthlete()">+ Atleta</button></div>`;
 const al=list.map(([id,a])=>[id,a,alertsFor(a)]).filter(x=>x[2].length);
 if(al.length)h+=`<div class="card cc" style="--cc:#ff4d4f"><div class="sec-t">Alertas</div>${al.map(([id,a,x])=>`<div class="li click" onclick="A.open('athlete','${id}')"><div class="av" style="background:${avc(a.name)}26;color:${avc(a.name)}">${esc(initials(a.name))}</div><div class="f1"><div class="b">${esc(a.name)}</div><div>${x.map(([c,m])=>`<span class="pill ${c}">${esc(m)}</span>`).join(' ')}</div></div></div>`).join('')}</div>`;
 h+=`<div class="card cc" style="--cc:#8b5cf6">${list.length?list.map(([id,a])=>{const w=(a.wellness||[]).find(x=>x.d===t);const r=readiness(w);const ci=catInfo(a);const tot=(a.rms?.arranque||0)+(a.rms?.envion||0);const coach=(S.config.coaches||[]).includes(id);
  return`<div class="li click" onclick="A.open('athlete','${id}')"><div class="av" style="background:${avc(a.name)}26;color:${avc(a.name)}">${esc(initials(a.name))}</div><div class="f1"><div class="b">${esc(a.name)} ${coach?'<span class="pill acc">profe</span>':''}${a.manual?'<span class="pill">sin cuenta</span>':''}</div><div class="sm mut">${ci?ci.label:'—'} · Total ${tot?fk(tot):'—'} · ${weekCount(a)} entrenos esta semana</div></div>${r!=null?`<span class="pill ${rdClass(r)}">${r}</span>`:'<span class="pill">sin check-in</span>'}</div>`}).join(''):`<div class="empty">Aún no hay atletas.<br><br>Comparte el link de la app: cada atleta se registra con su nombre y un PIN.<br>También puedes agregar atletas a mano con “+ Atleta”.</div>`}</div>`;
 h+=`<div class="card sm mut"><b style="color:var(--tx)">Cómo sumar atletas:</b> mándales el link de la app. Cada uno toca <b>Registrarme</b>, pone su nombre y un PIN, y crea su perfil. Otros profes entran con la contraseña de profe.</div>`;
 return h}

/* ---------- detalle atleta (profe) ---------- */

 let h=`<button class="back" onclick="A.back()">‹ Equipo</button>`;
 if(al.length)h+=`<div class="card">${al.map(([c,m])=>`<span class="pill ${c}">${esc(m)}</span>`).join(' ')}</div>`;
 h+=vProfile(id,true);
 if(!a.manual&&id!==S.me.id&&id[0]==='a')h+=`<div class="card cc" style="--cc:#f59e0b"><div class="sec-t">¿Olvidó su PIN?</div><div class="row"><input id="newpin" type="password" inputmode="numeric" placeholder="Nuevo PIN (4 a 6 números)"><button class="btn sm sec" onclick="A.resetPin('${id}')">Cambiar</button></div></div>`;
 if(a.manual)h+=`<div class="card row sp"><div class="sm mut">Atleta sin cuenta, administrado por el profe.</div><button class="btn sm danger" onclick="A.delAthlete('${id}')">${S.confirm==='da'+id?'¿Seguro? Toca otra vez':'Eliminar'}</button></div>`;
 return h}

/* ---------- perfil ---------- */
function vProfile(id,coachMode){const a=S.athletes[id];if(!a)return'';const step=a.step||1;
 const total=(a.rms?.arranque||0)+(a.rms?.envion||0);const sc=sinclair(total,a.bw,a.sex);const ci=catInfo(a);
 let h=`<div class="card cc" style="--cc:#ff5a1f"><div class="row sp" style="align-items:flex-start"><div class="row"><div class="av" style="width:48px;height:48px;font-size:20px">${esc(initials(a.name))}</div><div><h2 style="margin:0">${esc(a.name)}</h2><div class="mut sm">${a.sex==='F'?'Femenino':a.sex==='M'?'Masculino':''}${a.by?' · '+age(a.by)+' años':''} · ${ageGroup(a.by)}</div></div></div><button class="btn sm sec" onclick="A.editProfile('${id}')">Editar</button></div>
 <div class="grid3" style="margin-top:12px"><div class="stat"><div class="l">Peso</div><div class="v">${fk(a.bw)}</div><div class="xs mut">${ci?'Cat. '+ci.label:''}</div></div><div class="stat"><div class="l">Total</div><div class="v">${total?fk(total):'—'}</div></div><div class="stat"><div class="l">Sinclair</div><div class="v">${sc?fk(Math.round(sc*10)/10):'—'}</div></div></div></div>`;
 h+=`<div class="card cc" style="--cc:#8b5cf6"><div class="row sp"><h3>Récords (RM)</h3><span class="xs mut">toca uno para ver %</span></div><div class="grid2">${EX.map(e=>{const pts=(a.rmHist||[]).filter(p=>p.ex===e.k).sort((x,y)=>x.d.localeCompare(y.d)).map(p=>({x:p.d,y:p.kg}));const last=pts[pts.length-1];
  return`<div class="stat lift" style="cursor:pointer;--lc:${EXC[e.k]}" onclick="A.pctTable('${id}','${e.k}')"><div class="l">${e.n}</div><div class="row sp"><div class="v">${fk(a.rms?.[e.k])}<span class="xs mut"> kg</span></div><div class="xs mut">${last?fmtD(last.x):''}</div></div>${pts.length>=2?spark(pts,{h:28,color:EXC[e.k]}):''}</div>`}).join('')}</div></div>`;
 // proyecciones
 const PJ=['arranque','envion','sfrontal','strasera'];const g=a.goals||{};
 let pTot=0,pOk=true;
 h+=`<div class="card cc" style="--cc:#f59e0b"><div class="row sp"><h3>Proyecciones y objetivos</h3><button class="btn sm sec" onclick="A.goals('${id}')">Objetivos</button></div>${PJ.map(ex=>{const p=project(a,ex);if(!p)return'';const goal=g[ex];
  if(ex==='arranque'||ex==='envion'){if(p.p12)pTot+=p.p12;else if(p.cur)pTot+=p.cur;else pOk=false}
  let eta='';if(goal&&p.slope>0&&goal>p.cur){const days=(goal-p.cur)/p.slope;eta=`a este ritmo: ${fmtD(addDays(ymd(),Math.round(days)),{month:'short',year:'numeric'})}`}
  return`<div class="li" style="display:block"><div class="row sp"><b>${EXN[ex]}</b><span class="sm">${fk(p.cur)} kg${p.slope!=null?` · <span style="color:${p.slope>=0?'var(--ok)':'var(--bad)'}">${p.slope>=0?'+':''}${fk(p.slope*30)} kg/mes</span>`:''}</span></div>
  <div class="sm mut">${p.p12?`En 12 semanas ≈ <b class="kg">${fk(p.p12)} kg</b>`:'Registra más RM para calcular la tendencia'}${goal?` · objetivo <b style="color:var(--tx)">${fk(goal)} kg</b>${g.date?' para el '+fmtD(g.date):''}`:''}</div>
  ${goal?`<div class="prog"><i style="width:${Math.min(100,p.cur/goal*100)}%"></i></div><div class="xs mut" style="margin-top:3px">${Math.round(p.cur/goal*100)}% del objetivo${eta?' · '+eta:''}</div>`:''}</div>`}).join('')||'<div class="mut sm">Ingresa tus RM para ver proyecciones.</div>'}
  ${pOk&&pTot&&a.bw?`<div class="stat" style="margin-top:8px"><div class="l">Total proyectado (12 semanas)</div><div class="v">${fk(pTot)} kg <span class="sm mut">· Sinclair ${fk(Math.round(sinclair(pTot,a.bw,a.sex)*10)/10)}</span></div></div>`:''}</div>`;
 // ratios
 const rr=RATIOS.filter(([x,y])=>a.rms?.[x]&&a.rms?.[y]);
 h+=`<div class="card cc" style="--cc:#06b6d4"><h3>Relaciones entre levantamientos</h3>${rr.length?rr.map(([x,y,n,lo,hi,mLo,mHi])=>{const v=a.rms[x]/a.rms[y]*100;const st=v<lo?'warn':v>hi?'warn':'ok';return`<div class="li" style="display:block"><div class="row sp"><span>${n}</span><span><b>${Math.round(v)}%</b> <span class="pill ${st}">${v<lo?'bajo':v>hi?'alto':'ok'}</span></span></div><div class="xs mut">Referencia ${lo}–${hi}%${v<lo?' · '+mLo:v>hi?' · '+mHi:''}</div></div>`}).join('')+'<div class="xs mut" style="margin-top:6px">Rangos de referencia aproximados; el profe decide.</div>':'<div class="mut sm">Ingresa más RM (arranque, envión, sentadillas, cargada y jerk) para comparar.</div>'}</div>`;
 // peso corporal
 const bwp=(a.bwHist||[]).slice().sort((x,y)=>x.d.localeCompare(y.d)).map(p=>({x:p.d,y:p.kg}));
 h+=`<div class="card cc" style="--cc:#3b82f6"><div class="row sp"><h3>Peso corporal</h3><span class="sm">${fk(a.bw)} kg${ci&&ci.limit?` · límite ${ci.limit}`:''}</span></div>${spark(bwp,{h:70,color:'#3b82f6',ref:ci&&ci.limit&&bwp.length>=2?ci.limit:null})}${ci&&ci.limit?'<div class="xs mut">Línea roja: límite de la categoría.</div>':''}</div>`;
 // sensaciones
 const ws=(a.wellness||[]).slice().sort((x,y)=>x.d.localeCompare(y.d));const rp=ws.slice(-21).map(w=>({x:w.d,y:readiness(w)})).filter(p=>p.y!=null);
 h+=`<div class="card cc" style="--cc:#2ecc71"><div class="row sp"><h3>Sensaciones</h3>${!coachMode?`<button class="btn sm sec" onclick="A.wellness()">+ Hoy</button>`:''}</div>${spark(rp,{h:60,color:'#2ecc71'})}
  ${ws.length?`<div class="tblwrap" style="margin-top:8px"><table class="x"><tr><th>Fecha</th><th>Disp.</th><th>Sueño</th><th>Fatiga</th><th>Dolor</th><th>Motiv.</th><th>Nota</th></tr>${ws.slice(-10).reverse().map(w=>{const r=readiness(w);return`<tr><td>${fmtD(w.d)}</td><td><span class="pill ${rdClass(r)}">${r??'—'}</span></td><td>${w.sueno??'—'}</td><td>${w.fatiga??'—'}</td><td>${w.dolor||0}${w.zona?' · '+esc(w.zona):''}</td><td>${w.motiv??'—'}</td><td>${esc(w.nota||'')}</td></tr>`}).join('')}</table></div>`:'<div class="mut sm">Sin registros.</div>'}</div>`;
 // carga semanal
 const weeks={};(a.lastLogs||[]).forEach(l=>{const m=mondayOf(l.d);(weeks[m]=weeks[m]||[]).push(l)});const wk=Object.keys(weeks).sort().reverse().slice(0,6);
 h+=`<div class="card cc" style="--cc:#eab308"><h3>Carga semanal</h3>${wk.length?`<div class="tblwrap"><table class="x"><tr><th>Semana</th><th>Ses.</th><th>NL</th><th>Tonelaje</th><th>Int. media</th><th>RPE</th></tr>${wk.map(m=>{const L=weeks[m];const nl=L.reduce((s,l)=>s+(l.nl||0),0);const ton=L.reduce((s,l)=>s+(l.ton||0),0);const ints=L.filter(l=>l.int);const rp=L.filter(l=>l.rpe);return`<tr><td>${fmtD(m)}</td><td>${L.length}</td><td>${nl}</td><td>${fk(ton/1000)} t</td><td>${ints.length?Math.round(ints.reduce((s,l)=>s+l.int,0)/ints.length)+'%':'—'}</td><td>${rp.length?fk(rp.reduce((s,l)=>s+l.rpe,0)/rp.length):'—'}</td></tr>`}).join('')}</table></div><div class="xs mut" style="margin-top:6px">NL = número de levantamientos (repeticiones totales). Int. media = % promedio del RM.</div>`:'<div class="mut sm">Aún no hay entrenamientos registrados.</div>'}</div>`;
 // historial
 h+=`<div class="card cc" style="--cc:#ec4899"><div class="row sp"><h3>Entrenamientos</h3>${!coachMode?`<button class="btn sm sec" onclick="A.logNew()">+ Registrar</button>`:''}</div>${S.logsUid!==id||!S.logsLoaded?'<div class="mut sm">Cargando…</div>':logsHTML(id,coachMode)}</div>`;
 return h}
function logsHTML(id,coachMode){const L=Object.entries(S.logs).sort((x,y)=>(y[1].d||'').localeCompare(x[1].d||'')||(y[1].ts||0)-(x[1].ts||0)).slice(0,25);if(!L.length)return'<div class="mut sm">Sin entrenamientos registrados.</div>';
 return L.map(([lid,l])=>`<div class="li" style="display:block"><div class="row sp"><b>${fmtD(l.d,{weekday:'short',day:'numeric',month:'short'})} · ${esc(l.sName||'Entrenamiento')}</b>${!coachMode?`<button class="btn sm ghost" onclick="A.logEdit('${lid}')">Editar</button>`:''}</div>
  <div class="sm">${(l.rows||[]).filter(r=>r.name).map(r=>`<span class="chip">${esc(r.name)} <b class="kg">${fk(r.kg)}</b>${r.reps?'×'+r.reps:''}${r.sets>1?'×'+r.sets:''}${r.rpe?` <span class="mut">RPE ${r.rpe}</span>`:''}${r.miss?` <span style="color:var(--bad)">${r.miss} fallo${r.miss>1?'s':''}</span>`:''}</span>`).join('')}</div>
  ${l.nota?`<div class="sm mut" style="margin-top:4px">“${esc(l.nota)}”</div>`:''}
  ${(l.videos||[]).map(v=>v.drive?`<iframe src="https://drive.google.com/file/d/${encodeURIComponent(v.drive)}/preview" allow="autoplay" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:6px;background:#000"></iframe>`:`<video controls preload="metadata" playsinline src="${esc(srcOf(v))}"></video>`).join('')}
  ${(l.coachNotes||[]).map(n=>`<div class="note"><span class="xs" style="opacity:.7">Profe · ${fmtD(n.d)}</span><br>${esc(n.text)}</div>`).join('')}
  ${coachMode?`<div class="row" style="margin-top:6px"><input id="cn_${lid}" placeholder="Comentario para el atleta…"><button class="btn sm" onclick="A.coachNote('${id}','${lid}')">Enviar</button></div>`:''}</div>`).join('')}

/* ---------- planis ---------- */
function planItem(id,p){const n=p.assign==='all'?'Todos':(p.assign||[]).length+' atletas';const icons=[(p.sheets||[]).length?'Excel':'',(p.images||[]).length?'Foto':'',(p.sessions||[]).length?(p.sessions.length+(p.sessions.length===1?' sesión':' sesiones')):''].filter(Boolean);
 let comp='';if(role()==='coach'){const targets=athleteList().filter(([u])=>planVisible(p,u));const done=targets.filter(([u,a])=>(a.lastLogs||[]).some(l=>l.planId===id)).length;if(targets.length)comp=` · ${done}/${targets.length} registraron`}
 return`<div class="li click" onclick="A.open('plan','${id}')"><div class="av" style="border-radius:10px">${svg('plans')}</div><div class="f1"><div class="b">${esc(p.title||'Plani')}</div><div class="sm mut">Semana del ${fmtD(p.week)} · ${role()==='coach'?n+comp:icons.join(' · ')}</div></div><span class="mut">›</span></div>`}
function vPlans(){const c=role()==='coach';const L=sortedPlans().filter(([id,p])=>c||planVisible(p,S.me.id));
 return`<div class="row sp"><h1>${c?'Planis':'Mi plani'}</h1>${c?'<button class="btn sm" onclick="A.newPlan()">+ Nueva plani</button>':''}</div>
 <div class="card cc" style="--cc:#ff5a1f">${L.length?L.map(([id,p])=>planItem(id,p)).join(''):`<div class="empty">${c?'Sube tu primera plani: un Excel, una foto, o ármala en la app.':'El profe aún no sube planificación.'}</div>`}</div>`}
function renderSheet(sh,a){if(!sh)return'';const rows=sh.rows||[];const pctCols=new Set();rows.slice(0,3).forEach(r=>(r.c||[]).forEach((v,i)=>{const n=norm(v).trim();if(n==='%'||/porcent|intensidad/.test(n))pctCols.add(i)}));let last=null;
 const body=rows.map(r=>{const c=r.c||[];const ex=detectEx(c.join(' '));if(ex)last=ex;else if((c[0]||'').trim())last=null;const base=ex||last;
  return`<tr><td>${base?`<span class="pill">${EXN[base]}</span>`:''}</td>${c.map((v,i)=>`<td>${annot(v,base,pctCols.has(i),a)}</td>`).join('')}</tr>`}).join('');
 return`<div class="tblwrap"><table class="x"><tr><th class="xs">Base %</th>${(rows[0]?.c||[]).map((_,i)=>`<th class="xs">${String.fromCharCode(65+(i%26))}</th>`).join('')}</tr>${body}</table></div>`}
function annot(v,base,isPctCol,a){let h=esc(v);if(!base||!a)return h;const rm=a.rms?.[base];if(!rm)return h;let hit=false;const st=a.step||1;
 h=h.replace(/(\d{2,3}(?:[.,]\d+)?)\s*%/g,(m,p)=>{const pc=parseFloat(p.replace(',','.'));if(pc<30||pc>120)return m;hit=true;return`${m} <span class="kg">${fk(rnd(rm*pc/100,st))}kg</span>`});
 if(!hit)h=h.replace(/\b(\d{2,3})\s*\/\s*(\d{1,2})\b/g,(m,p)=>{const pc=+p;if(pc<40||pc>110)return m;hit=true;return`${m} <span class="kg">${fk(rnd(rm*pc/100,st))}kg</span>`});
 if(!hit&&isPctCol){const n=num(v);if(n!=null){const pc=n<=1.2?n*100:n;if(pc>=30&&pc<=120)h+=` <span class="kg">${fk(rnd(rm*pc/100,st))}kg</span>`}}
 return h}
function vPlan(id){const p=S.plans[id];if(!p)return`<button class="back" onclick="A.back()">‹ Volver</button><div class="empty">Esta plani ya no existe.</div>`;
 const c=role()==='coach';const targets=athleteList().filter(([u])=>planVisible(p,u));
 if(c&&(!S.previewAth||!S.athletes[S.previewAth]))S.previewAth=(targets[0]||athleteList()[0]||[])[0]||null;
 const a=c?S.athletes[S.previewAth]:myA();
 let h=`<button class="back" onclick="A.back()">‹ Planis</button><div class="row sp" style="align-items:flex-start"><div><h1>${esc(p.title||'Plani')}</h1><div class="mut sm">Semana del ${fmtD(p.week,{day:'numeric',month:'long'})} · ${p.assign==='all'?'todo el equipo':(p.assign||[]).length+' atletas'}</div></div>${c?`<button class="btn sm sec" onclick="A.editPlan('${id}')">Editar</button>`:''}</div>`;
 if(p.notes)h+=`<div class="note" style="margin:10px 0 12px">${esc(p.notes).replace(/\n/g,'<br>')}</div>`;else h+='<div style="height:10px"></div>';
 if(c){h+=`<div class="card cc" style="--cc:#8b5cf6"><label style="margin-top:0">Ver kilos calculados para</label><select onchange="S.previewAth=this.value;render()">${athleteList().map(([u,x])=>`<option value="${u}" ${u===S.previewAth?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  ${targets.length?`<div class="sm" style="margin-top:10px">${targets.map(([u,x])=>{const n=(x.lastLogs||[]).filter(l=>l.planId===id).length;return`<span class="chip">${n?'✅':'⏳'} ${esc(x.name)}${n?' · '+n:''}</span>`}).join('')}</div>`:''}</div>`}
 else if(!a||!a.rms||!Object.keys(a.rms).length)h+=`<div class="banner">Ingresa tus RM en Perfil para ver los kilos calculados.</div>`;
 if((p.images||[]).length)h+=`<div class="card cc" style="--cc:#3b82f6"><div class="sec-t">Plani en foto</div>${p.images.map((im,i)=>`<img class="plan" src="${esc(srcOf(im))}" alt="Plani" onclick="A.zoom('${id}',${i})">`).join('')}</div>`;
 if((p.images||[]).length||(p.sheets||[]).length){const q=S.qc;const kg=a?kgOf(a,q.ex,q.pct):null;
  h+=`<div class="card cc" style="--cc:#f59e0b"><div class="sec-t">Calculadora rápida${a?' · '+esc(a.name):''}</div><div class="grid2"><select onchange="S.qc.ex=this.value;render()">${EX.map(e=>`<option value="${e.k}" ${e.k===q.ex?'selected':''}>${e.n}</option>`).join('')}</select><input type="number" inputmode="decimal" value="${q.pct}" oninput="S.qc.pct=num(this.value)||0;A.qcUpd()" placeholder="%"></div><div id="qcres" style="margin-top:8px">${qcRes(a)}</div></div>`}
 if((p.sheets||[]).length){const si=Math.min(S.sheetIdx,p.sheets.length-1);h+=`<div class="card cc" style="--cc:#2ecc71"><div class="sec-t">Plani del Excel</div>${p.sheets.length>1?`<div class="tabs">${p.sheets.map((s,i)=>`<button class="${i===si?'on':''}" onclick="S.sheetIdx=${i};render()">${esc(s.name)}</button>`).join('')}</div>`:''}${renderSheet(p.sheets[si],a)}<div class="xs mut" style="margin-top:6px">Los kilos se calculan con los RM ${a?'de '+esc(a.name):''} según el ejercicio detectado en cada fila.</div></div>`}

 e.c.forEach(id=>{const x=S.comps[id];h+=`<div class="li"><span class="pill acc">🏆</span><div class="f1"><b>${esc(x.name)}</b><div class="sm mut">${esc(x.place||'')}${x.notes?' · '+esc(x.notes):''}</div></div>${c?`<button class="btn sm danger" onclick="A.delComp('${id}')">${S.confirm==='dc'+id?'¿Seguro?':'Borrar'}</button>`:''}</div>`});

function toolAth(){const s=S.tools.src;if(s==='manual')return null;return s==='me'?myA():S.athletes[s]}
function vTools(){const T=S.tools;const c=role()==='coach';
 const tabs=[['pct','% del RM'],['plates','Discos'],['att','Intentos'],['sin','Sinclair'],['est','RM estimado']];
 let h=`<h1>Herramientas</h1><div class="tabs">${tabs.map(([k,l])=>`<button class="${T.tab===k?'on':''}" onclick="S.tools.tab='${k}';render()">${l}</button>`).join('')}</div><div class="card">`;

 if(T.tab==='pct'){const a=toolAth();h+=`${srcSel()}<div class="grid2"><div><label>Ejercicio</label><select onchange="S.tools.ex=this.value;render()">${EX.map(e=>`<option value="${e.k}" ${e.k===T.ex?'selected':''}>${e.n}</option>`).join('')}</select></div><div><label>RM (kg)</label>${a?`<input value="${fk(a.rms?.[T.ex])}" disabled>`:`<input type="number" inputmode="decimal" value="${esc(T.rm)}" oninput="S.tools.rm=this.value;A.toolUpd()">`}</div></div>
  <label>Porcentaje: <span id="pctl">${T.pct}</span>%</label><input type="range" min="30" max="110" step="1" value="${T.pct}" oninput="S.tools.pct=+this.value;$('#pctl').textContent=this.value;A.toolUpd()">`}

 if(T.tab==='att')h+=`${srcSel()}<div class="grid2"><div><label>RM arranque</label><input type="number" inputmode="decimal" value="${esc(T.sn)}" oninput="S.tools.sn=this.value;A.toolUpd()"></div><div><label>RM envión</label><input type="number" inputmode="decimal" value="${esc(T.cj)}" oninput="S.tools.cj=this.value;A.toolUpd()"></div></div><label>Estrategia</label><div class="seg">${Object.keys(ATT).map(k=>`<button class="${T.att===k?'on':''}" onclick="S.tools.att='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`;
 if(T.tab==='sin')h+=`<div class="grid2"><div><label style="margin-top:0">Total (kg)</label><input type="number" inputmode="decimal" value="${esc(T.sTot)}" oninput="S.tools.sTot=this.value;A.toolUpd()"></div><div><label style="margin-top:0">Peso corporal</label><input type="number" inputmode="decimal" value="${esc(T.sBw)}" oninput="S.tools.sBw=this.value;A.toolUpd()"></div></div><label>Sexo</label><div class="seg"><button class="${T.sSex==='M'?'on':''}" onclick="S.tools.sSex='M';render()">Masculino</button><button class="${T.sSex==='F'?'on':''}" onclick="S.tools.sSex='F';render()">Femenino</button></div>`;
 if(T.tab==='est')h+=`<div class="grid2"><div><label style="margin-top:0">Kilos levantados</label><input type="number" inputmode="decimal" value="${esc(T.eKg)}" oninput="S.tools.eKg=this.value;A.toolUpd()"></div><div><label style="margin-top:0">Repeticiones</label><input type="number" inputmode="numeric" value="${esc(T.eReps)}" oninput="S.tools.eReps=this.value;A.toolUpd()"></div></div>`;

function toolRes(){const T=S.tools;
 if(T.tab==='pct'){const a=toolAth();const rm=a?a.rms?.[T.ex]:num(T.rm);const st=a?.step||1;if(!rm)return`<div class="mut sm">${a?'Este atleta no tiene RM de '+EXN[T.ex]+'.':'Ingresa el RM.'}</div>`;const kg=rnd(rm*T.pct/100,st);
  return`<div style="text-align:center"><div class="big">${fk(kg)} kg</div><div class="mut sm">${T.pct}% de ${fk(rm)} kg</div></div>${plateHTML(kg,a?.sex==='F'?15:20,true)}<div class="tblwrap" style="margin-top:10px"><table class="x"><tr><th>%</th><th>kg</th><th>%</th><th>kg</th></tr>${[50,55,60,65,70,75,80,85].map(p=>`<tr><td>${p}%</td><td class="kg">${fk(rnd(rm*p/100,st))}</td><td>${p+40>110?'':p+40+'%'}</td><td class="kg">${p+40>110?'':fk(rnd(rm*(p+40)/100,st))}</td></tr>`).join('')}</table></div>`}
 if(T.tab==='plates'){const v=num(T.target);return v?plateHTML(v,T.bar,T.collars):'<div class="mut sm">Ingresa un peso.</div>'}
 if(T.tab==='att'){const sn=num(T.sn),cj=num(T.cj);const P=ATT[T.att];if(!sn&&!cj)return'<div class="mut sm">Ingresa los RM.</div>';
  const r=x=>x?P.map(p=>Math.round(x*p/100)):['—','—','—'];const s=r(sn),j=r(cj);
  return`<table class="x"><tr><th></th><th>1°</th><th>2°</th><th>3°</th></tr><tr><td>Arranque</td>${s.map(x=>`<td class="kg">${x}</td>`).join('')}</tr><tr><td>Envión</td>${j.map(x=>`<td class="kg">${x}</td>`).join('')}</tr></table><div class="sm" style="margin-top:8px">Total si sale todo: <b>${(sn?s[2]:0)+(cj?j[2]:0)} kg</b> · total asegurado con aperturas: <b>${(sn?s[0]:0)+(cj?j[0]:0)} kg</b></div><div class="xs mut" style="margin-top:4px">${P.join('% / ')}% del RM. Ajusta según cómo se sienta el atleta en el calentamiento.</div>`}
 if(T.tab==='sin'){const t=num(T.sTot),b=num(T.sBw);if(!t||!b)return'<div class="mut sm">Ingresa total y peso.</div>';const s=sinclair(t,b,T.sSex);return`<div style="text-align:center"><div class="big">${fk(Math.round(s*10)/10)}</div><div class="mut sm">puntos Sinclair · coeficiente ${(s/t).toFixed(4)}</div></div><div class="xs mut" style="margin-top:8px">Coeficientes IWF 2021–2024 (los del ciclo 2025–2028 aún no se publican completos).</div>`}
 if(T.tab==='est'){const k=num(T.eKg),r=num(T.eReps);if(!k||!r)return'<div class="mut sm">Ingresa kilos y repeticiones.</div>';const ep=r===1?k:k*(1+r/30),br=r===1?k:k*36/(37-r);const e=(ep+br)/2;

 return''}

function addHist(arr,o,key){const i=arr.findIndex(x=>x.d===o.d&&(key?x[key]===o[key]:true));if(i>=0)arr.splice(i,1);arr.push(o)}
A.saveProfile=async()=>{const m=S.modal,v=m.v;if(!v.name||!v.name.trim())return toast('Escribe el nombre');const prev=S.athletes[v.uid];const a=prev?clone(prev):{rmHist:[],bwHist:[],wellness:[],lastLogs:[],goals:{},createdAt:ymd()};
 if(m.manual)a.manual=true;a.name=v.name.trim();a.sex=v.sex;a.by=v.by||null;a.step=v.step||1;a.rms=a.rms||{};a.rmHist=a.rmHist||[];a.bwHist=a.bwHist||[];const d=ymd();
 for(const e of EX){const nv=v.rms[e.k];if(nv==null||nv<=0){delete a.rms[e.k];continue}if(a.rms[e.k]!==nv){a.rms[e.k]=nv;addHist(a.rmHist,{ex:e.k,kg:nv,d},'ex')}}
 if(v.bw&&v.bw!==a.bw){a.bw=v.bw;addHist(a.bwHist,{d,kg:v.bw})}else if(!v.bw)a.bw=null;
 a.rmHist=a.rmHist.slice(-300);a.bwHist=a.bwHist.slice(-200);a.updatedAt=Date.now();
 if(await put('athletes/'+v.uid,a)){closeModal();toast('Perfil guardado')}};

  if(rm&&r.kg){ip+=r.kg/rm*100*reps*sets;iw+=reps*sets}

 if(await put('athletes/'+S.me.id,a)){closeModal();toast(prs.length?'🎉 ¡Nuevo RM en '+prs.join(', ')+'!':'Entrenamiento guardado');render()}};

A.coachNote=async(u,lid)=>{const el=$('#cn_'+lid);const txt=el&&el.value.trim();if(!txt)return;const l=clone(S.logs[lid]);if(!l)return;l.coachNotes=l.coachNotes||[];l.coachNotes.push({d:ymd(),ts:Date.now(),text:txt,by:S.me.id});el.value='';if(await put('athletes/'+u+'/logs/'+lid,l))toast('Comentario enviado')};

A.newPlan=()=>{S.draft={id:uid(),title:'',week:mondayOf(ymd()),assign:'all',notes:'',sheets:[],images:[],sessions:[],createdAt:Date.now(),isNew:true};S.view={t:'planEdit'};render();scrollTo(0,0)};
A.editPlan=id=>{S.draft={...clone(S.plans[id]),id,isNew:false};S.draft.sheets=S.draft.sheets||[];S.draft.images=S.draft.images||[];S.draft.sessions=S.draft.sessions||[];if(S.draft.assign!=='all'&&!Array.isArray(S.draft.assign))S.draft.assign='all';S.view={t:'planEdit'};render();scrollTo(0,0)};
A.cancelEdit=()=>{const d=S.draft;S.draft=null;S.confirm=null;S.view=d&&!d.isNew?{t:'plan',id:d.id}:null;S.tab='plans';render()};
A.toggleAssign=(u,on)=>{const d=S.draft;d.assign=Array.isArray(d.assign)?d.assign:[];d.assign=on?[...new Set([...d.assign,u])]:d.assign.filter(x=>x!==u)};
A.sesAdd=()=>{const days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const n=S.draft.sessions.length;S.draft.sessions.push({name:days[n]||'Sesión '+(n+1),items:[{name:'',base:null,scheme:'',notes:''}]});render()};
A.itAdd=si=>{S.draft.sessions[si].items.push({name:'',base:null,scheme:'',notes:''});render()};
A.itName=(si,ii,val)=>{const it=S.draft.sessions[si].items[ii];it.name=val;if(!it.baseManual){it.base=detectEx(val);const el=$('#b'+si+'_'+ii);if(el)el.value=it.base||''}};
A.itBase=(si,ii,val)=>{const it=S.draft.sessions[si].items[ii];it.base=val||null;it.baseManual=true};
A.itScheme=(si,ii,val)=>{S.draft.sessions[si].items[ii].scheme=val;const el=$('#ss'+si+'_'+ii);if(el)el.innerHTML=schemeTxt(val)};
async function parseExcel(file){if(!window.XLSX)throw new Error('xlsx');let wb;if(/\.csv$/i.test(file.name))wb=XLSX.read(await file.text(),{type:'string'});else wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
 return wb.SheetNames.slice(0,8).map(n=>{const raw=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});let rows=raw.slice(0,250).map(r=>({c:(r||[]).slice(0,30).map(v=>String(v??'').slice(0,120))}));
  while(rows.length&&rows[rows.length-1].c.every(v=>!v.trim()))rows.pop();
  const mc=Math.max(0,...rows.map(r=>{let i=r.c.length;while(i&&!r.c[i-1].trim())i--;return i}));rows.forEach(r=>{r.c=r.c.slice(0,mc);while(r.c.length<mc)r.c.push('')});
  return{name:n,rows}}).filter(s=>s.rows.length)}
A.xlsIn=async inp=>{const f=inp.files[0];inp.value='';if(!f)return;try{const sh=await parseExcel(f);if(!sh.length)return toast('El archivo está vacío');S.draft.sheets=sh;if(!S.draft.title)S.draft.title=f.name.replace(/\.\w+$/,'');render();toast(sh.length+' hoja(s) cargada(s)')}catch(e){toast(e.message==='xlsx'?'El lector de Excel no cargó. Revisa tu conexión y recarga.':'No se pudo leer el archivo.')}};
A.imgIn=async inp=>{const fs=[...inp.files];inp.value='';if(!fs.length)return;S.uploading=true;render();for(const f0 of fs){try{const f=await shrinkImage(f0);if(f.size>20*1024*1024){toast('Imagen muy grande');continue}const r=await upload(f);S.draft&&S.draft.images.push(r)}catch(e){errToast(e);break}}S.uploading=false;render()};
A.savePlan=async()=>{const d=S.draft;if(!d.title.trim())return toast('Ponle un título');if(Array.isArray(d.assign)&&!d.assign.length)return toast('Elige al menos un atleta');
 if(!(d.sheets.length||d.images.length||d.sessions.length||d.notes.trim()))return toast('Sube un Excel, una foto o arma al menos una sesión');
 const data={title:d.title.trim(),week:d.week||mondayOf(ymd()),assign:d.assign,notes:d.notes||'',sheets:d.sheets,images:d.images,sessions:d.sessions.map(s=>({name:s.name,items:(s.items||[]).filter(it=>it.name||it.scheme)})),createdAt:d.createdAt||Date.now(),updatedAt:Date.now(),by:S.me.id};
 if(JSON.stringify(data).length>240000)return toast('El Excel es muy grande. Deja solo la hoja de la semana e intenta de nuevo.');
 if(await put('plans/'+d.id,data)){const id=d.id;S.draft=null;S.view={t:'plan',id};S.tab='plans';render();scrollTo(0,0);toast('Plani publicada')}};
A.delPlan=()=>twoTap('dp',async()=>{const id=S.draft.id;if(await del('plans/'+id)){S.draft=null;S.view=null;S.tab='plans';render();toast('Plani eliminada')}});
// agenda
function slotTimes(s){return[...new Set((String(s||'').match(/\b\d{1,2}[:.]\d{2}\b/g)||[]).map(t=>{const[x,y]=t.split(/[:.]/);return String(+x).padStart(2,'0')+':'+y}).filter(t=>+t.slice(0,2)<24&&+t.slice(3)<60))].sort()}
function slotDates(v){if(!v.start||!v.days.length)return[];const out=[];const m0=mondayOf(v.start);for(let w=0;w<(v.weeks||1);w++)for(const d of v.days){const ds=addDays(m0,w*7+d-1);if(ds>=v.start)out.push(ds)}return out.sort()}
function slotCountTxt(v){const d=slotDates(v),t=slotTimes(v.times);if(!d.length||!t.length)return'Elige al menos un día y una hora.';return`Se crearán <b>${d.length*t.length}</b> horarios: ${d.length} días × ${t.length} hora${t.length>1?'s':''} (${t.join(', ')}), del ${fmtD(d[0])} al ${fmtD(d[d.length-1])}.`}
A.slotCount=()=>{const el=$('#slotcount');if(el)el.innerHTML=slotCountTxt(S.modal.v)};
A.slotDay=d=>{const v=S.modal.v;v.days=v.days.includes(d)?v.days.filter(x=>x!==d):[...v.days,d].sort();renderModal()};
A.slotNew=()=>openModal({t:'slot',v:{start:S.calSel>=ymd()?S.calSel:ymd(),days:[1,2,3,4,5],times:'18:00',weeks:4,dur:90,cap:10,title:'Entrenamiento',notes:''}});
A.saveSlot=async()=>{if(S.saving)return;const v=S.modal.v;const d=slotDates(v),t=slotTimes(v.times);if(!d.length||!t.length)return toast('Elige al menos un día y una hora');if(d.length*t.length>300)return toast('Son demasiados horarios de una vez (máx. 300)');
 const items=[];t.forEach(tm=>{const g=uid();d.forEach(ds=>items.push({path:'slots/'+uid(),data:{date:ds,time:tm,dur:v.dur||60,cap:v.cap||null,title:v.title||'Entrenamiento',notes:v.notes||'',group:g}}))});
 S.saving=true;renderModal();const ok=await putMany(items);S.saving=false;if(ok){closeModal();toast(items.length+' horarios creados')}else renderModal()};
const wdOf=ds=>((dt(ds).getDay()+6)%7)+1;
function seriesSlots(g){const t=ymd();return Object.entries(S.slots).filter(([i,x])=>g&&x.group===g&&x.date>=t)}
A.slotEdit=id=>{const s=S.slots[id];if(!s)return;const ser=seriesSlots(s.group);const days=[...new Set(ser.map(([i,x])=>wdOf(x.date)))].sort();const until=ser.reduce((m,[i,x])=>x.date>m?x.date:m,s.date);
 openModal({t:'slotEdit',v:{id,date:s.date,time:s.time,dur:s.dur||60,cap:s.cap??null,title:s.title||'',notes:s.notes||'',all:ser.length>1,days:days.length?days:[wdOf(s.date)],until}})};
A.editDay=d=>{const v=S.modal.v;v.days=v.days.includes(d)?v.days.filter(x=>x!==d):[...v.days,d].sort();renderModal()};
function seriesPlan(v){const s=S.slots[v.id];const ser=seriesSlots(s.group);const t=ymd();const upd=[],del=[],add=[];const have=new Set();
 ser.forEach(([i,x])=>{if(v.days.includes(wdOf(x.date))&&x.date<=v.until){upd.push(i);have.add(x.date)}else del.push(i)});
 if(v.until&&v.days.length){let d=t;let n=0;while(d<=v.until&&n<400){if(v.days.includes(wdOf(d))&&!have.has(d))add.push(d);d=addDays(d,1);n++}}
 return{upd,del,add}}
function seriesTxt(v){if(!v.days.length)return'Elige al menos un día.';if(!v.until)return'Elige hasta qué fecha.';const p=seriesPlan(v);return`Quedarán <b>${p.upd.length+p.add.length}</b> horarios hasta el ${fmtD(v.until)}${p.add.length?` · <span style="color:#5fe39a">+${p.add.length} nuevos</span>`:''}${p.del.length?` · <span style="color:#ff8a8c">−${p.del.length} se borran</span>`:''}.`}
A.seriesCount=()=>{const el=$('#sercount');if(el)el.innerHTML=seriesTxt(S.modal.v)};
A.saveSlotEdit=async()=>{if(S.saving)return;const v=S.modal.v;const s=S.slots[v.id];if(!s)return closeModal();if(!v.date||!/^\d{2}:\d{2}$/.test(v.time||''))return toast('Revisa fecha y hora');
 if(v.all&&s.group&&seriesSlots(s.group).length>1){if(!v.days.length||!v.until)return toast('Elige días y fecha final');const p=seriesPlan(v);const ch={time:v.time,dur:v.dur||60,cap:v.cap||null,title:v.title||'Entrenamiento',notes:v.notes||''};
  const items=p.upd.map(i=>({path:'slots/'+i,data:{...clone(S.slots[i]),...ch}})).concat(p.add.map(d=>({path:'slots/'+uid(),data:{date:d,...ch,group:s.group}})));
  S.saving=true;renderModal();let ok=await putMany(items);if(ok&&p.del.length)ok=await delMany(p.del.map(i=>'slots/'+i));S.saving=false;
  if(ok){closeModal();toast('Serie actualizada: '+(p.upd.length+p.add.length)+' horarios')}else renderModal();return}
 const ch={time:v.time,dur:v.dur||60,cap:v.cap||null,title:v.title||'Entrenamiento',notes:v.notes||''};const items=[{path:'slots/'+v.id,data:{...clone(s),...ch,date:v.date}}];
 if(v.all&&s.group)Object.entries(S.slots).forEach(([i,x])=>{if(i!==v.id&&x.group===s.group&&x.date>=ymd())items.push({path:'slots/'+i,data:{...clone(x),...ch}})});
 S.saving=true;renderModal();const ok=await putMany(items);S.saving=false;if(ok){closeModal();toast(items.length>1?items.length+' horarios actualizados':'Horario actualizado')}else renderModal()};
A.delSlotEdit=()=>twoTap('dse',async()=>{const v=S.modal.v;const s=S.slots[v.id];if(!s)return closeModal();let ids=[v.id];if(v.all&&s.group)ids=Object.entries(S.slots).filter(([i,x])=>x.group===s.group&&x.date>=ymd()).map(([i])=>i);if(!ids.includes(v.id))ids.push(v.id);if(await delMany(ids.map(i=>'slots/'+i))){closeModal();toast(ids.length>1?ids.length+' horarios borrados':'Horario borrado')}});
A.compNew=()=>openModal({t:'comp',v:{name:'',date:S.calSel,place:'',notes:''}});
A.saveComp=async()=>{const v=S.modal.v;if(!v.name.trim()||!v.date)return toast('Falta nombre o fecha');if(await put('comps/'+uid(),{name:v.name.trim(),date:v.date,place:v.place||'',notes:v.notes||''})){closeModal();toast('Competencia creada')}};
A.delComp=id=>twoTap('dc'+id,()=>del('comps/'+id));
A.book=async id=>{const me=S.me.id;const b=clone(S.bookings[me])||{slots:[]};const t=ymd();b.slots=(b.slots||[]).filter(x=>S.slots[x]&&S.slots[x].date>=t);const s=S.slots[id];
 if(b.slots.includes(id)){b.slots=b.slots.filter(x=>x!==id);if(await put('bookings/'+me,b))toast('Reserva cancelada');return}
 const n=Object.values(S.bookings).filter(x=>(x.slots||[]).includes(id)).length;if(s.cap&&n>=s.cap)return toast('No quedan cupos');
 b.slots.push(id);if(await put('bookings/'+me,b))toast('Hora reservada')};

/* ===================== login ===================== */
function vLogin(){const L=S.lg;if(S.bootErr)return`<div class="card"><h2>No se pudo conectar</h2><p class="mut">${esc(S.bootErr)}</p></div>`;
 let h=`<div class="card" style="text-align:center;padding:24px 18px"><div style="width:120px;margin:0 auto 6px">${LOGO}</div><div class="brand" style="font-size:42px">BAR<b>RA</b></div><div class="mut">Halterofilia · planificación y seguimiento</div></div><div class="card">`;
 if(!S.coachSet){h+=`<h2>Configuración inicial</h2><div class="sm mut">Crea la contraseña del profe. Con ella entran los profes; los atletas se registran con su nombre y un PIN.</div><label>Tu nombre</label><input value="${esc(L.name||'')}" oninput="A.lg('name',this.value)"><label>Contraseña de profe (mín. 6)</label><input type="password" oninput="A.lg('pass',this.value)"><label>Repite la contraseña</label><input type="password" oninput="A.lg('pass2',this.value)"><button class="btn full" style="margin-top:14px" onclick="A.doLogin()">${S.lgBusy?'Creando…':'Crear y entrar'}</button>`}
 else{h+=`<div class="seg"><button class="${L.role==='athlete'?'on':''}" onclick="S.lg.role='athlete';render()">Soy atleta</button><button class="${L.role==='coach'?'on':''}" onclick="S.lg.role='coach';render()">Soy profe</button></div>`;
  if(L.role==='athlete')h+=`<div class="seg" style="margin-top:8px"><button class="${L.mode==='login'?'on':''}" onclick="S.lg.mode='login';render()">Entrar</button><button class="${L.mode==='reg'?'on':''}" onclick="S.lg.mode='reg';render()">Registrarme</button></div><label>Nombre y apellido</label><input value="${esc(L.name||'')}" oninput="A.lg('name',this.value)"><label>PIN (4 a 6 números)</label><input type="password" inputmode="numeric" value="${esc(L.pin||'')}" oninput="A.lg('pin',this.value)">`;
  else h+=`<label>Tu nombre</label><input value="${esc(L.name||'')}" oninput="A.lg('name',this.value)"><label>Contraseña de profe</label><input type="password" value="${esc(L.pass||'')}" oninput="A.lg('pass',this.value)">`;
  h+=`<button class="btn full" style="margin-top:14px" ${S.lgBusy?'disabled':''} onclick="A.doLogin()">${S.lgBusy?'Entrando…':L.role==='athlete'&&L.mode==='reg'?'Crear cuenta':'Entrar'}</button>`}
 return h+'</div>'}
A.lg=(k,v)=>{S.lg[k]=v};
A.doLogin=async()=>{const L=S.lg;if(S.lgBusy)return;
 if(!S.coachSet){if(!L.name||!L.pass)return toast('Completa nombre y contraseña');if(L.pass.length<6)return toast('La contraseña debe tener al menos 6 caracteres');if(L.pass!==L.pass2)return toast('Las contraseñas no coinciden')}
 else if(!L.name)return toast('Escribe tu nombre');
 S.lgBusy=true;render();
 try{let r;if(!S.coachSet){r=await call('setupCoach',{name:L.name,pass:L.pass});S.coachSet=true}
  else if(L.role==='coach')r=await call('login',{role:'coach',name:L.name,pass:L.pass});
  else if(L.mode==='reg'){if(!/^\d{4,6}$/.test(L.pin||'')){S.lgBusy=false;render();return toast('El PIN debe tener 4 a 6 números')}r=await call('register',{name:L.name,pin:L.pin})}
  else r=await call('login',{role:'athlete',name:L.name,pin:L.pin});
  TOKEN=r.token;try{localStorage.setItem('barra-token',TOKEN)}catch(e){}setMe(r.me);S.lg={role:'athlete',mode:'login'};S.lgBusy=false;render();await refresh();startApp()}
 catch(e){S.lgBusy=false;render();toast(e.message||'Error')}};
A.logout=()=>{TOKEN=null;try{localStorage.removeItem('barra-token')}catch(e){}clearInterval(S.poll);S.poll=null;LS={};S.me={id:null,name:''};S.owner=false;S.viewAs=null;S.view=null;S.logsUid=null;S.modal=null;renderModal();localSync();render()};
A.resetPin=async u=>{const el=$('#newpin');const pin=el&&el.value.trim();if(!/^\d{4,6}$/.test(pin||''))return toast('El PIN debe tener 4 a 6 números');try{await call('resetPin',{uid:u,pin});el.value='';toast('PIN cambiado')}catch(e){errToast(e)}};

boot();
</script>
